[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "morpheus-defense"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.32,<1",
  "psutil>=6,<7",
  "jinja2>=3.1,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.18,<1",
]

[project.optional-dependencies]
network-monitoring = [
  "scapy>=2.6,<3",
]
build = [
  "pyinstaller>=6.19,<7",
  "pywin32>=310; platform_system == 'Windows'",
]

[project.scripts]
morpheus = "morpheus.main:cli"

[tool.setuptools]
packages = ["morpheus"]

[tool.setuptools.package-data]
morpheus = ["templates/*.html"]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"
